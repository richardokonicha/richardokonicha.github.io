<!doctype html>
<!--
  The 1200×630 link unfurl, rendered from the same paper and ink as the site.
  Regenerate with `npm run og` after changing a token in globals.css.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        background: #f4f0e6;
        color: #14110e;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }
      .rule {
        height: 1px;
        margin-bottom: 34px;
        background: #14110e;
        opacity: 0.28;
      }
      .name {
        font-size: 92px;
        line-height: 0.95;
        letter-spacing: -0.015em;
      }
      .tag {
        margin-top: 26px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 22px;
        line-height: 1.5;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: #6b6257;
      }
      .foot {
        position: absolute;
        right: 88px;
        bottom: 56px;
        left: 88px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding-top: 18px;
        border-top: 1px solid rgb(20 17 14 / 28%);
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 17px;
        line-height: 1;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b6257;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 14px;
        vertical-align: 1px;
        background: #9c3d1a;
      }
    </style>
  </head>
  <body>
    <div class="rule"></div>
    <div class="name">Richard<br />Okonicha</div>
    <div class="tag">A log of things built, studied and noticed</div>
    <div class="foot">
      <span><i class="dot"></i>Engineer &amp; Writer</span>
      <span>richardokonicha.github.io</span>
    </div>
  </body>
</html>
