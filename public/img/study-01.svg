<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Generative field study">
  <defs>
    <radialGradient id="core" cx="46%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#bdbdbd"/>
      <stop offset="68%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="4" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="120" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#050505"/>

  <g filter="url(#warp)">
    <circle cx="400" cy="392" r="286" fill="url(#core)"/>
    <g fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.55">
      <circle cx="400" cy="392" r="286"/>
      <circle cx="400" cy="392" r="248"/>
      <circle cx="400" cy="392" r="210"/>
      <circle cx="400" cy="392" r="172"/>
      <circle cx="400" cy="392" r="134"/>
      <circle cx="400" cy="392" r="96"/>
      <circle cx="400" cy="392" r="58"/>
    </g>
    <path d="M40 604 C 210 470, 340 690, 520 540 S 760 470, 800 520"
          fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <path d="M0 236 C 180 330, 300 120, 500 250 S 720 340, 800 280"
          fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.45"/>
  </g>

  <rect width="800" height="800" filter="url(#grain)" opacity="0.55"/>
</svg>